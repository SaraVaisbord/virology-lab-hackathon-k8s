apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: virology-lab
  labels:
    app: backend
spec:
  replicas: 1                       # one extraction worker; the data is in RDS and S3, so a restart loses nothing
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend
      containers:
        - name: backend
          image: ${BACKEND_IMAGE}
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets   # DATABASE_URL + GEMINI_API_KEY*
          resources:                    # OCR + image processing of 300 dpi pages
            requests:
              memory: "1536Mi"
              cpu: "1"
            limits:
              memory: "3Gi"
              cpu: "2"
          startupProbe:                 # first start runs the database migrations
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
