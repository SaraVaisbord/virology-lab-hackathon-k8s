apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: people-mgnt-db-credentials
  namespace: people-management
  labels:
    app: people-management
    component: database
    managed-by: external-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: app-secret
    creationPolicy: Owner
  data:
    - secretKey: DB_USER
      remoteRef:
        key: people-mgnt-PeopleManagement/db-pass
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: people-mgnt-PeopleManagement/db-pass
        property: DB_PASSWORD
    - secretKey: MYSQL_ROOT_PASSWORD
      remoteRef:
        key: people-mgnt-PeopleManagement/db-pass
        property: MYSQL_ROOT_PASSWORD
