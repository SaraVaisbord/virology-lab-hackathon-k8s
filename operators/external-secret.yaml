# One Kubernetes secret for the backend, built from two Secrets Manager entries (created by Terraform):
#   <prefix>/db      {"DATABASE_URL": "postgresql+psycopg://…@<rds>:5432/forms"}
#   <prefix>/gemini  {"GEMINI_API_KEY": "…", "GEMINI_API_KEY_2": "…", …}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: virology-lab
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: backend-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: SECRET_PREFIX/db
    - extract:
        key: SECRET_PREFIX/gemini
